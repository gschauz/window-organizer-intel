name: Mac build

on:
  push:
    branches: [main]
    tags: ['v*-intel*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package app
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      WINDOW_ORGANIZER_BUILD_DIR: ${{ github.workspace }}/.build
      WINDOW_ORGANIZER_APP_PATH: ${{ github.workspace }}/dist/Window Organizer.app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show build tools
        run: |
          swift --version
          xcodebuild -version
          test "$(uname -m)" = x86_64
      - name: Run tests
        run: bash scripts/test.sh
      - name: Build app
        run: bash scripts/build.sh
      - name: Package and verify download
        run: |
          mkdir -p dist
          codesign --verify --strict "$WINDOW_ORGANIZER_APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$WINDOW_ORGANIZER_APP_PATH" "dist/Window-Organizer-Intel.zip"
          ditto -x -k "dist/Window-Organizer-Intel.zip" "$RUNNER_TEMP/verify-download"
          codesign --verify --strict "$RUNNER_TEMP/verify-download/Window Organizer.app"
          lipo -verify_arch x86_64 "$RUNNER_TEMP/verify-download/Window Organizer.app/Contents/MacOS/WindowOrganizer"
          cmp "$WINDOW_ORGANIZER_APP_PATH/Contents/MacOS/WindowOrganizer" "$RUNNER_TEMP/verify-download/Window Organizer.app/Contents/MacOS/WindowOrganizer"
      - name: Upload app download
        uses: actions/upload-artifact@v7
        with:
          name: Window-Organizer-Intel
          path: dist/Window-Organizer-Intel.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Window-Organizer-Intel
      - name: Publish the verified Intel app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Window-Organizer-Intel.zip --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "Window Organizer Pre-Silicon $GITHUB_REF_NAME" \
            --notes "For Intel Macs running macOS 13 or later. Unzip, move Window Organizer.app to Applications, and enable Accessibility when prompted. This build is ad-hoc signed."
